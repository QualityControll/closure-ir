name: Cargo Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM and MLIR 22
        uses: yasuo-ozu/llvm-full@v1
        id: llvm
        with:
          version: "22.1.5"
          env: true

      - name: Install MLIR 22 development files
        run: |
          sudo apt-get update
          sudo apt-get install -y libmlir-22-dev mlir-22-tools

      - name: Verify LLVM and MLIR installation
        run: |
          llvm-config --version
          llvm-config --prefix
          test -d /usr/lib/llvm-22/include/mlir-c
          test -e /usr/lib/llvm-22/lib/libMLIR.so || test -e /usr/lib/llvm-22/lib/libMLIR.a

      - name: Cargo test
        run: cargo test
