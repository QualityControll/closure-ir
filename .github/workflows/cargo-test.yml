name: Cargo Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM 22
        uses: yasuo-ozu/llvm-full@v1
        with:
          version: "22.1.5"
          env: true

      - name: Cargo test
        run: cargo test
