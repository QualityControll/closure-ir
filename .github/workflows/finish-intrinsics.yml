name: finish-intrinsics

on:
  push:
    branches: [add-intrinsics]

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-intrinsics
          fetch-depth: 0

      - name: Implement intrinsic lowering and tests
        shell: python
        run: |
          from pathlib import Path

          p = Path('closure-ir/src/operators.rs')
          s = p.read_text()
          old = '''        Expr::Tuple { elements } => {\n            let fields = elements.iter().enumerate().map(|(index, element)| Ok(FieldInfo { name: index.to_string(), type_info: expression_type(argument_types, element)? })).collect::<Result<Vec<_>, String>>()?;\n            Ok(TypeInfo::Struct { name: "tuple".to_string(), fields })\n        }\n        Expr::Add { lhs, .. }'''
          new = '''        Expr::Tuple { elements } => {\n            let fields = elements.iter().enumerate().map(|(index, element)| Ok(FieldInfo { name: index.to_string(), type_info: expression_type(argument_types, element)? })).collect::<Result<Vec<_>, String>>()?;\n            Ok(TypeInfo::Struct { name: "tuple".to_string(), fields })\n        }\n        Expr::Intrinsic { intrinsic, arguments } => {\n            let expected_arity = match intrinsic {\n                crate::expr::Intrinsic::Min | crate::expr::Intrinsic::Max | crate::expr::Intrinsic::Pow => 2,\n                _ => 1,\n            };\n            if arguments.len() != expected_arity {\n                return Err(format!("intrinsic {:?} expects {} argument(s)", intrinsic, expected_arity));\n            }\n            let first = expression_type(argument_types, &arguments[0])?;\n            if !first.is_numeric() {\n                return Err(format!("intrinsic {:?} requires a numeric argument", intrinsic));\n            }\n            for argument in &arguments[1..] {\n                let ty = expression_type(argument_types, argument)?;\n                if ty != first {\n                    return Err(format!("intrinsic {:?} arguments must have the same type", intrinsic));\n                }\n            }\n            match intrinsic {\n                crate::expr::Intrinsic::Sqrt | crate::expr::Intrinsic::Sin | crate::expr::Intrinsic::Cos |\n                crate::expr::Intrinsic::Tan | crate::expr::Intrinsic::Exp | crate::expr::Intrinsic::Log |\n                crate::expr::Intrinsic::Floor | crate::expr::Intrinsic::Ceil | crate::expr::Intrinsic::Round |\n                crate::expr::Intrinsic::Pow => {\n                    if !matches!(first, TypeInfo::F32 | TypeInfo::F64) {\n                        return Err(format!("intrinsic {:?} requires f32 or f64", intrinsic));\n                    }\n                }\n                _ => {}\n            }\n            Ok(first)\n        }\n        Expr::Add { lhs, .. }'''
          if old not in s:\n              raise SystemExit('operators.rs insertion point not found')\n          p.write_text(s.replace(old, new, 1))

          p = Path('closure-ir/src/lowering.rs')
          s = p.read_text()
          old = '''            Expr::Tuple { elements } =>\n                self.lower_tuple(\n                    context,\n                    builder,\n                    function,\n                    arguments,\n                    argument_types,\n                    expected_type,\n                    elements,\n                ),\n\n            Expr::IfElse {'''
          new = '''            Expr::Tuple { elements } =>\n                self.lower_tuple(\n                    context,\n                    builder,\n                    function,\n                    arguments,\n                    argument_types,\n                    expected_type,\n                    elements,\n                ),\n\n            Expr::Intrinsic { intrinsic, arguments: intrinsic_arguments } =>\n                self.lower_intrinsic(\n                    context,\n                    builder,\n                    function,\n                    arguments,\n                    argument_types,\n                    expected_type,\n                    intrinsic,\n                    intrinsic_arguments,\n                ),\n\n            Expr::IfElse {'''
          if old not in s:\n              raise SystemExit('lowering.rs match insertion point not found')\n          s = s.replace(old, new, 1)

          marker = '''    // ========================================================\n    // Tuple\n    // ========================================================\n'''
          intrinsic_impl = r'''    fn lower_intrinsic(
        &self,
        context: &'ctx Context,
        builder: &Builder<'ctx>,
        function: FunctionValue<'ctx>,
        arguments: &[PointerValue<'ctx>],
        argument_types: &[TypeInfo],
        expected_type: &TypeInfo,
        intrinsic: &crate::expr::Intrinsic,
        intrinsic_arguments: &[Expr],
    ) -> Result<LoweredValue<'ctx>, String> {
        use crate::expr::Intrinsic;

        let arity = match intrinsic {
            Intrinsic::Min | Intrinsic::Max | Intrinsic::Pow => 2,
            _ => 1,
        };
        if intrinsic_arguments.len() != arity {
            return Err(format!("intrinsic {:?} expects {} argument(s)", intrinsic, arity));
        }

        let mut values = Vec::with_capacity(arity);
        for argument in intrinsic_arguments {
            let value = self.lower_expr(context, builder, function, arguments, argument_types, expected_type, argument)?;
            values.push(self.materialize_value(context, builder, value)?);
        }

        let type_info = match &values[0] {
            BasicValueEnum::FloatValue(value) if value.get_type() == context.f32_type() => TypeInfo::F32,
            BasicValueEnum::FloatValue(_) => TypeInfo::F64,
            BasicValueEnum::IntValue(value) => match value.get_type().get_bit_width() {
                1 => TypeInfo::Bool,
                8 => if matches!(expected_type, TypeInfo::U8) { TypeInfo::U8 } else { TypeInfo::I8 },
                16 => if matches!(expected_type, TypeInfo::U16) { TypeInfo::U16 } else { TypeInfo::I16 },
                32 => if matches!(expected_type, TypeInfo::U32) { TypeInfo::U32 } else { TypeInfo::I32 },
                64 => if matches!(expected_type, TypeInfo::U64) { TypeInfo::U64 } else { TypeInfo::I64 },
                128 => if matches!(expected_type, TypeInfo::U128) { TypeInfo::U128 } else { TypeInfo::I128 },
                bits => return Err(format!("unsupported integer width {} for intrinsic {:?}", bits, intrinsic)),
            },
            _ => return Err(format!("intrinsic {:?} requires numeric arguments", intrinsic)),
        };

        if &type_info != expected_type {
            return Err(format!("intrinsic {:?} result type {:?} does not match expected type {:?}", intrinsic, type_info, expected_type));
        }

        match intrinsic {
            Intrinsic::Abs => match values.as_slice() {
                [BasicValueEnum::FloatValue(value)] => {
                    let result = self.build_float_unary_intrinsic(context, builder, function, "llvm.fabs", *value)?;
                    Ok(LoweredValue::Value(result.into()))
                }
                [BasicValueEnum::IntValue(value)] => {
                    if type_info.is_unsigned_integer() {
                        Ok(LoweredValue::Value((*value).into()))
                    } else {
                        let zero = value.get_type().const_zero();
                        let negative = builder.build_int_compare(IntPredicate::SLT, *value, zero, "abs_neg")
                            .map_err(|e| format!("failed to build integer abs comparison: {:?}", e))?;
                        let negated = builder.build_int_neg(*value, "abs_negated")
                            .map_err(|e| format!("failed to build integer abs negation: {:?}", e))?;
                        let result = builder.build_select(negative, negated, *value, "abs")
                            .map_err(|e| format!("failed to build integer abs select: {:?}", e))?;
                        Ok(LoweredValue::Value(result))
                    }
                }
                _ => Err(format!("intrinsic {:?} requires numeric arguments", intrinsic)),
            },

            Intrinsic::Min | Intrinsic::Max => match (&values[0], &values[1]) {
                (BasicValueEnum::FloatValue(lhs), BasicValueEnum::FloatValue(rhs)) => {
                    let predicate = if matches!(intrinsic, Intrinsic::Min) { FloatPredicate::OLT } else { FloatPredicate::OGT };
                    let choose_lhs = builder.build_float_compare(predicate, *lhs, *rhs, "minmax_cmp")
                        .map_err(|e| format!("failed to build min/max comparison: {:?}", e))?;
                    let result = builder.build_select(choose_lhs, *lhs, *rhs, "minmax")
                        .map_err(|e| format!("failed to build min/max select: {:?}", e))?;
                    Ok(LoweredValue::Value(result))
                }
                (BasicValueEnum::IntValue(lhs), BasicValueEnum::IntValue(rhs)) => {
                    let predicate = match (matches!(intrinsic, Intrinsic::Min), type_info.is_unsigned_integer()) {
                        (true, true) => IntPredicate::ULT,
                        (true, false) => IntPredicate::SLT,
                        (false, true) => IntPredicate::UGT,
                        (false, false) => IntPredicate::SGT,
                    };
                    let choose_lhs = builder.build_int_compare(predicate, *lhs, *rhs, "minmax_cmp")
                        .map_err(|e| format!("failed to build min/max comparison: {:?}", e))?;
                    let result = builder.build_select(choose_lhs, *lhs, *rhs, "minmax")
                        .map_err(|e| format!("failed to build min/max select: {:?}", e))?;
                    Ok(LoweredValue::Value(result))
                }
                _ => Err(format!("intrinsic {:?} arguments must have matching types", intrinsic)),
            },

            Intrinsic::Tan => {
                let value = match values[0] { BasicValueEnum::FloatValue(value) => value, _ => return Err("intrinsic Tan requires f32 or f64".to_string()) };
                let sin = self.build_float_unary_intrinsic(context, builder, function, "llvm.sin", value)?;
                let cos = self.build_float_unary_intrinsic(context, builder, function, "llvm.cos", value)?;
                let result = builder.build_float_div(sin, cos, "tan")
                    .map_err(|e| format!("failed to build tan: {:?}", e))?;
                Ok(LoweredValue::Value(result.into()))
            }

            Intrinsic::Pow => {
                let lhs = match values[0] { BasicValueEnum::FloatValue(value) => value, _ => return Err("intrinsic Pow requires f32 or f64".to_string()) };
                let rhs = match values[1] { BasicValueEnum::FloatValue(value) => value, _ => return Err("intrinsic Pow requires f32 or f64".to_string()) };
                let result = self.build_float_binary_intrinsic(context, builder, function, "llvm.pow", lhs, rhs)?;
                Ok(LoweredValue::Value(result.into()))
            }

            Intrinsic::Sqrt | Intrinsic::Sin | Intrinsic::Cos | Intrinsic::Exp | Intrinsic::Log |
            Intrinsic::Floor | Intrinsic::Ceil | Intrinsic::Round => {
                let value = match values[0] { BasicValueEnum::FloatValue(value) => value, _ => return Err(format!("intrinsic {:?} requires f32 or f64", intrinsic)) };
                let name = match intrinsic {
                    Intrinsic::Sqrt => "llvm.sqrt",
                    Intrinsic::Sin => "llvm.sin",
                    Intrinsic::Cos => "llvm.cos",
                    Intrinsic::Exp => "llvm.exp",
                    Intrinsic::Log => "llvm.log",
                    Intrinsic::Floor => "llvm.floor",
                    Intrinsic::Ceil => "llvm.ceil",
                    Intrinsic::Round => "llvm.round",
                    _ => unreachable!(),
                };
                let result = self.build_float_unary_intrinsic(context, builder, function, name, value)?;
                Ok(LoweredValue::Value(result.into()))
            }
        }
    }

    fn build_float_unary_intrinsic(
        &self,
        context: &'ctx Context,
        builder: &Builder<'ctx>,
        function: FunctionValue<'ctx>,
        base_name: &str,
        value: FloatValue<'ctx>,
    ) -> Result<FloatValue<'ctx>, String> {
        let suffix = if value.get_type() == context.f32_type() { ".f32" } else { ".f64" };
        let name = format!("{}{}", base_name, suffix);
        let module = function.get_parent().ok_or_else(|| "function has no parent module".to_string())?;
        let float_type = value.get_type();
        let fn_type = float_type.fn_type(&[float_type.into()], false);
        let intrinsic = module.get_function(&name).unwrap_or_else(|| module.add_function(&name, fn_type, None));
        let call = builder.build_call(intrinsic, &[value.into()], base_name)
            .map_err(|e| format!("failed to build {} intrinsic: {:?}", base_name, e))?;
        match call.try_as_basic_value().left() {
            Some(result) => Ok(result.into_float_value()),
            None => Err(format!("{} returned no floating-point value", base_name)),
        }
    }

    fn build_float_binary_intrinsic(
        &self,
        context: &'ctx Context,
        builder: &Builder<'ctx>,
        function: FunctionValue<'ctx>,
        base_name: &str,
        lhs: FloatValue<'ctx>,
        rhs: FloatValue<'ctx>,
    ) -> Result<FloatValue<'ctx>, String> {
        let suffix = if lhs.get_type() == context.f32_type() { ".f32" } else { ".f64" };
        let name = format!("{}{}", base_name, suffix);
        let module = function.get_parent().ok_or_else(|| "function has no parent module".to_string())?;
        let float_type = lhs.get_type();
        let fn_type = float_type.fn_type(&[float_type.into(), float_type.into()], false);
        let intrinsic = module.get_function(&name).unwrap_or_else(|| module.add_function(&name, fn_type, None));
        let call = builder.build_call(intrinsic, &[lhs.into(), rhs.into()], base_name)
            .map_err(|e| format!("failed to build {} intrinsic: {:?}", base_name, e))?;
        match call.try_as_basic_value().left() {
            Some(result) => Ok(result.into_float_value()),
            None => Err(format!("{} returned no floating-point value", base_name)),
        }
    }

'''
          if marker not in s:\n              raise SystemExit('lowering.rs tuple marker not found')\n          s = s.replace(marker, intrinsic_impl + marker, 1)
          p.write_text(s)

          p = Path('closure-ir/tests/intrinsics.rs')
          p.write_text('''use closure_ir::{call, compile_closure};\n\n#[test]\nfn test_abs() {\n    let float = compile_closure!(|x: f64| -> f64 { abs(x) });\n    let integer = compile_closure!(|x: i32| -> i32 { abs(x) });\n    assert_eq!(call!(float, -3.5), 3.5);\n    assert_eq!(call!(float, 3.5), 3.5);\n    assert_eq!(call!(integer, -7), 7);\n    assert_eq!(call!(integer, 7), 7);\n}\n\n#[test]\nfn test_min_and_max() {\n    let float_min = compile_closure!(|x: f64, y: f64| -> f64 { min(x, y) });\n    let float_max = compile_closure!(|x: f64, y: f64| -> f64 { max(x, y) });\n    let int_min = compile_closure!(|x: i32, y: i32| -> i32 { min(x, y) });\n    let int_max = compile_closure!(|x: i32, y: i32| -> i32 { max(x, y) });\n    assert_eq!(call!(float_min, 2.0, 5.0), 2.0);\n    assert_eq!(call!(float_max, 2.0, 5.0), 5.0);\n    assert_eq!(call!(int_min, 2, 5), 2);\n    assert_eq!(call!(int_max, 2, 5), 5);\n}\n\n#[test]\nfn test_sqrt_f32_and_f64() {\n    let f32_closure = compile_closure!(|x: f32| -> f32 { sqrt(x) });\n    let f64_closure = compile_closure!(|x: f64| -> f64 { sqrt(x) });\n    assert!((call!(f32_closure, 9.0) - 3.0).abs() < 1e-6);\n    assert!((call!(f64_closure, 2.25) - 1.5).abs() < 1e-12);\n}\n\n#[test]\nfn test_floor_ceil_round() {\n    let floor = compile_closure!(|x: f64| -> f64 { floor(x) });\n    let ceil = compile_closure!(|x: f64| -> f64 { ceil(x) });\n    let round = compile_closure!(|x: f64| -> f64 { round(x) });\n    assert_eq!(call!(floor, 2.7), 2.0);\n    assert_eq!(call!(ceil, 2.2), 3.0);\n    assert_eq!(call!(round, 2.5), 3.0);\n}\n\n#[test]\nfn test_sin_cos_tan() {\n    let sin = compile_closure!(|x: f64| -> f64 { sin(x) });\n    let cos = compile_closure!(|x: f64| -> f64 { cos(x) });\n    let tan = compile_closure!(|x: f64| -> f64 { tan(x) });\n    assert!((call!(sin, 0.0)).abs() < 1e-12);\n    assert!((call!(cos, 0.0) - 1.0).abs() < 1e-12);\n    assert!((call!(tan, 0.0)).abs() < 1e-12);\n}\n\n#[test]\nfn test_exp_and_log() {\n    let exp = compile_closure!(|x: f64| -> f64 { exp(x) });\n    let log = compile_closure!(|x: f64| -> f64 { log(x) });\n    assert!((call!(exp, 1.0) - std::f64::consts::E).abs() < 1e-12);\n    assert!((call!(log, std::f64::consts::E) - 1.0).abs() < 1e-12);\n}\n\n#[test]\nfn test_pow() {\n    let f32_closure = compile_closure!(|x: f32| -> f32 { pow(x, 3.0) });\n    let f64_closure = compile_closure!(|x: f64| -> f64 { pow(x, 2.0) });\n    assert!((call!(f32_closure, 2.0) - 8.0).abs() < 1e-6);\n    assert!((call!(f64_closure, 3.0) - 9.0).abs() < 1e-12);\n}\n\n#[test]\nfn test_nested_intrinsics() {\n    let compiled = compile_closure!(|x: f64| -> f64 {\n        pow(sqrt(abs(x)), 2.0)\n    });\n    assert!((call!(compiled, -16.0) - 16.0).abs() < 1e-12);\n}\n''')

      - name: Run tests
        run: cargo test --workspace

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/finish-intrinsics.yml
          git add closure-ir/src/operators.rs closure-ir/src/lowering.rs closure-ir/tests/intrinsics.rs .github/workflows/finish-intrinsics.yml
          git commit -m "Implement intrinsic lowering" || exit 0
          git push origin add-intrinsics
