name: Verify intrinsics

on:
  push:
    branches:
      - add-arithmetic-intrinsics

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 22
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22 all
      - name: Test
        env:
          LLVM_SYS_220_PREFIX: /usr/lib/llvm-22
        run: cargo test --workspace
