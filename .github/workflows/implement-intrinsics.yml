name: implement-intrinsics

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  implement:
    if: github.event.pull_request.head.ref == 'add-intrinsics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-intrinsics
          fetch-depth: 0

      - name: Implement intrinsic lowering
        shell: python
        run: |
          from pathlib import Path
          p = Path('closure-ir/src/lowering.rs')
          s = p.read_text()
          old = '''            Expr::Neg { operand } =>
                self.lower_unary(
                    context,
                    builder,
                    function,
                    arguments,
                    argument_types,
                    expected_type,
                    operand,
                    UnaryOp::Neg,
                ),
        }
    }
'''
          new = '''            Expr::Neg { operand } =>
                self.lower_unary(
                    context,
                    builder,
                    function,
                    arguments,
                    argument_types,
                    expected_type,
                    operand,
                    UnaryOp::Neg,
                ),

            Expr::Intrinsic { intrinsic, arguments: intrinsic_arguments } =>
                self.lower_intrinsic(
                    context,
                    builder,
                    function,
                    arguments,
                    argument_types,
                    expected_type,
                    intrinsic,
                    intrinsic_arguments,
                ),
        }
    }

    fn lower_intrinsic(
        &self,
        context: &'ctx Context,
        builder: &Builder<'ctx>,
        function: FunctionValue<'ctx>,
        arguments: &[PointerValue<'ctx>],
        argument_types: &[TypeInfo],
        expected_type: &TypeInfo,
        intrinsic: &crate::expr::Intrinsic,
        intrinsic_arguments: &[Expr],
    ) -> Result<LoweredValue<'ctx>, String> {
        use crate::expr::Intrinsic;

        let arity = match intrinsic {
            Intrinsic::Min | Intrinsic::Max | Intrinsic::Pow => 2,
            _ => 1,
        };
        if intrinsic_arguments.len() != arity {
            return Err(format!("intrinsic {:?} expects {} argument(s)", intrinsic, arity));
        }
        let float_type = match expected_type {
            TypeInfo::F32 => context.f32_type(),
            TypeInfo::F64 => context.f64_type(),
            _ => return Err(format!("intrinsic {:?} requires an f32 or f64 result", intrinsic)),
        };
        let mut values = Vec::with_capacity(intrinsic_arguments.len());
        for arg in intrinsic_arguments {
            let value = self.lower_expr(context, builder, function, arguments, argument_types, expected_type, arg)?;
            let value = self.materialize_value(context, builder, value)?;
            values.push(match value {
                BasicValueEnum::FloatValue(value) => value,
                _ => return Err(format!("intrinsic {:?} requires floating-point arguments", intrinsic)),
            });
        }

        match intrinsic {
            Intrinsic::Abs => {
                let zero = float_type.const_zero();
                let negative = builder.build_float_compare(FloatPredicate::OLT, values[0], zero, "abs_neg")
                    .map_err(|e| format!("failed to build abs comparison: {:?}", e))?;
                let negated = builder.build_float_neg(values[0], "abs_negated")
                    .map_err(|e| format!("failed to build abs negation: {:?}", e))?;
                let result = builder.build_select(negative, negated, values[0], "abs")
                    .map_err(|e| format!("failed to build abs select: {:?}", e))?;
                Ok(LoweredValue::Value(result))
            }
            Intrinsic::Min | Intrinsic::Max => {
                let predicate = if matches!(intrinsic, Intrinsic::Min) { FloatPredicate::OLT } else { FloatPredicate::OGT };
                let choose_lhs = builder.build_float_compare(predicate, values[0], values[1], "minmax_cmp")
                    .map_err(|e| format!("failed to build min/max comparison: {:?}", e))?;
                let result = builder.build_select(choose_lhs, values[0], values[1], "minmax")
                    .map_err(|e| format!("failed to build min/max select: {:?}", e))?;
                Ok(LoweredValue::Value(result))
            }
            Intrinsic::Tan => {
                let sin = self.build_float_intrinsic(context, builder, function, "llvm.sin", values[0], float_type)?;
                let cos = self.build_float_intrinsic(context, builder, function, "llvm.cos", values[0], float_type)?;
                Ok(LoweredValue::Value(builder.build_float_div(sin, cos, "tan").map_err(|e| format!("failed to build tan: {:?}", e))?.into()))
            }
            _ => {
                let name = match intrinsic {
                    Intrinsic::Sqrt => "llvm.sqrt",
                    Intrinsic::Sin => "llvm.sin",
                    Intrinsic::Cos => "llvm.cos",
                    Intrinsic::Exp => "llvm.exp",
                    Intrinsic::Log => "llvm.log",
                    Intrinsic::Floor => "llvm.floor",
                    Intrinsic::Ceil => "llvm.ceil",
                    Intrinsic::Round => "llvm.round",
                    Intrinsic::Pow => "llvm.pow",
                    _ => unreachable!(),
                };
                let result = if matches!(intrinsic, Intrinsic::Pow) {
                    self.build_float_binary_intrinsic(context, builder, function, name, values[0], values[1], float_type)?
                } else {
                    self.build_float_intrinsic(context, builder, function, name, values[0], float_type)?
                };
                Ok(LoweredValue::Value(result.into()))
            }
        }
    }

    fn build_float_intrinsic(
        &self,
        context: &'ctx Context,
        builder: &Builder<'ctx>,
        function: FunctionValue<'ctx>,
        base_name: &str,
        value: FloatValue<'ctx>,
        float_type: inkwell::types::FloatType<'ctx>,
    ) -> Result<FloatValue<'ctx>, String> {
        let suffix = if float_type == context.f32_type() { ".f32" } else { ".f64" };
        let name = format!("{}{}", base_name, suffix);
        let module = function.get_parent().ok_or_else(|| "function has no parent module".to_string())?;
        let fn_type = float_type.fn_type(&[float_type.into()], false);
        let intrinsic = module.get_function(&name).unwrap_or_else(|| module.add_function(&name, fn_type, None));
        let call = builder.build_call(intrinsic, &[value.into()], base_name)
            .map_err(|e| format!("failed to build {} intrinsic: {:?}", base_name, e))?;
        match call.try_as_basic_value().left() {
            Some(result) => Ok(result.into_float_value()),
            None => Err(format!("{} returned no floating-point value", base_name)),
        }
    }

    fn build_float_binary_intrinsic(
        &self,
        context: &'ctx Context,
        builder: &Builder<'ctx>,
        function: FunctionValue<'ctx>,
        base_name: &str,
        lhs: FloatValue<'ctx>,
        rhs: FloatValue<'ctx>,
        float_type: inkwell::types::FloatType<'ctx>,
    ) -> Result<FloatValue<'ctx>, String> {
        let suffix = if float_type == context.f32_type() { ".f32" } else { ".f64" };
        let name = format!("{}{}", base_name, suffix);
        let module = function.get_parent().ok_or_else(|| "function has no parent module".to_string())?;
        let fn_type = float_type.fn_type(&[float_type.into(), float_type.into()], false);
        let intrinsic = module.get_function(&name).unwrap_or_else(|| module.add_function(&name, fn_type, None));
        let call = builder.build_call(intrinsic, &[lhs.into(), rhs.into()], base_name)
            .map_err(|e| format!("failed to build {} intrinsic: {:?}", base_name, e))?;
        match call.try_as_basic_value().left() {
            Some(result) => Ok(result.into_float_value()),
            None => Err(format!("{} returned no floating-point value", base_name)),
        }
    }
'''
          if old not in s:
              raise SystemExit('lowering.rs match point not found')
          p.write_text(s.replace(old, new, 1))

      - name: Add intrinsic integration tests
        shell: bash
        run: |
          cat > closure-ir/tests/intrinsics.rs <<'EOF'
          use closure_ir::{call, compile_closure};

          #[test]
          fn sqrt() { let c = compile_closure!(|x: f64| -> f64 { sqrt(x) }); assert!((call!(c, 9.0) - 3.0).abs() < 1e-12); }
          #[test]
          fn abs() { let c = compile_closure!(|x: f64| -> f64 { abs(x) }); assert_eq!(call!(c, -3.5), 3.5); }
          #[test]
          fn min_max() { let c = compile_closure!(|x: f64, y: f64| -> f64 { max(min(x, y), 2.0) }); assert_eq!(call!(c, 3.0, 1.0), 2.0); }
          #[test]
          fn floor_ceil_round() { let f = compile_closure!(|x: f64| -> f64 { floor(x) }); let c = compile_closure!(|x: f64| -> f64 { ceil(x) }); let r = compile_closure!(|x: f64| -> f64 { round(x) }); assert_eq!(call!(f, 2.7), 2.0); assert_eq!(call!(c, 2.2), 3.0); assert_eq!(call!(r, 2.5), 3.0); }
          #[test]
          fn trig_exp_log_pow() { let s = compile_closure!(|x: f64| -> f64 { sin(x) }); let co = compile_closure!(|x: f64| -> f64 { cos(x) }); let t = compile_closure!(|x: f64| -> f64 { tan(x) }); let e = compile_closure!(|x: f64| -> f64 { exp(x) }); let l = compile_closure!(|x: f64| -> f64 { log(x) }); let p = compile_closure!(|x: f64| -> f64 { pow(x, 2.0) }); assert!((call!(s, 0.0)).abs() < 1e-12); assert!((call!(co, 0.0) - 1.0).abs() < 1e-12); assert!((call!(t, 0.0)).abs() < 1e-12); assert!((call!(e, 1.0) - std::f64::consts::E).abs() < 1e-12); assert!((call!(l, std::f64::consts::E) - 1.0).abs() < 1e-12); assert!((call!(p, 3.0) - 9.0).abs() < 1e-12); }
          EOF

      - name: Run tests
        run: cargo test --workspace

      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/implement-intrinsics.yml
          git add closure-ir/src/lowering.rs closure-ir/tests/intrinsics.rs .github/workflows/implement-intrinsics.yml
          git commit -m "Implement math intrinsic lowering" || exit 0
          git push origin add-intrinsics
